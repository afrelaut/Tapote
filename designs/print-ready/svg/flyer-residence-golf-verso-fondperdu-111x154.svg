<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="111mm" height="154mm" viewBox="0 0 1110 1540"><style>@font-face{font-family:"Archivo Black";src:url("../fonts/ArchivoBlack-Regular.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"Archivo";src:url("../fonts/Archivo-Variable.ttf") format("truetype");font-weight:100 900;font-style:normal}
@font-face{font-family:"Nunito";src:url("../fonts/Nunito-Variable.ttf") format("truetype");font-weight:200 1000;font-style:normal}</style><rect width="1110" height="1540" fill="#FFFFFF"/><text x="559" y="152" text-anchor="middle" fill="#9A968E" font-family="Archivo" font-weight="700" font-size="24" letter-spacing="8">CE QUE FAIT TAPOTE</text><text x="554" y="258" text-anchor="middle" fill="#141414" font-family="Archivo Black" font-weight="400" font-size="76" letter-spacing="-2">Un geste suffit.</text><text x="555" y="322" text-anchor="middle" fill="#6C6860" font-family="Archivo" font-weight="400" font-size="29">Votre client pose son téléphone sur votre support. La page</text><text x="555" y="364" text-anchor="middle" fill="#6C6860" font-family="Archivo" font-weight="400" font-size="29">que vous avez choisie s’ouvre. C’est tout.</text><circle cx="156" cy="480" r="46" fill="#EAF0FF"/><path d="M156.0,454.0L162.4,471.2L180.7,472.0L166.4,483.4L171.3,501.0L156.0,490.9L140.7,501.0L145.6,483.4L131.3,472.0L149.6,471.2Z" fill="#F7C85D"/><text x="232" y="474" text-anchor="start" fill="#141414" font-family="Archivo" font-weight="700" font-size="34">Un avis Google</text><text x="232" y="516" text-anchor="start" fill="#6C6860" font-family="Archivo" font-weight="400" font-size="26">au moment où le client paie</text><circle cx="156" cy="612" r="46" fill="#EAF0FF"/><g transform="translate(133.00 589.00) scale(1.9167)" fill="none" stroke="#2458FF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.4"/><path d="M3 10h18M8 3v4M16 3v4"/></g><text x="232" y="606" text-anchor="start" fill="#141414" font-family="Archivo" font-weight="700" font-size="34">Une réservation</text><text x="232" y="648" text-anchor="start" fill="#6C6860" font-family="Archivo" font-weight="400" font-size="26">dès l’entrée, sans passer un appel</text><circle cx="156" cy="744" r="46" fill="#EAF0FF"/><g transform="translate(133.00 721.00) scale(1.9167)" fill="none" stroke="#2458FF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 21a8.5 8.5 0 0 0-17 0"/><circle cx="12" cy="7.6" r="4.3"/></g><text x="232" y="738" text-anchor="start" fill="#141414" font-family="Archivo" font-weight="700" font-size="34">Votre contact enregistré</text><text x="232" y="780" text-anchor="start" fill="#6C6860" font-family="Archivo" font-weight="400" font-size="26">à la fin d’un rendez-vous</text><text x="556" y="916" text-anchor="middle" fill="#9A968E" font-family="Archivo" font-weight="700" font-size="22" letter-spacing="2">COMPTOIR À LA CAISSE · PLAQUE AU MUR · CARD DANS LA POCHE</text><rect x="110" y="972" width="890" height="282" rx="44" fill="#141414"/><text x="174" y="1054" text-anchor="start" fill="#FFFFFF" font-family="Archivo Black" font-weight="400" font-size="42" letter-spacing="-1">Pourquoi du papier ?</text><text x="174" y="1114" text-anchor="start" fill="#CFCBC3" font-family="Archivo" font-weight="400" font-size="26">Tapote existe pour arrêter de distribuer des cartes qu’on jette. Ce</text><text x="174" y="1154" text-anchor="start" fill="#CFCBC3" font-family="Archivo" font-weight="400" font-size="26">flyer est donc tiré en toute petite série, sur papier recyclé, et il porte</text><text x="174" y="1194" text-anchor="start" fill="#CFCBC3" font-family="Archivo" font-weight="400" font-size="26">une vraie puce. Ce n’est pas un prospectus : c’est un échantillon.</text><text x="555" y="1338" text-anchor="middle" fill="#141414" font-family="Archivo" font-weight="700" font-size="30">Vous êtes commerçant, artisan ou indépendant ?</text><text x="555" y="1384" text-anchor="middle" fill="#6C6860" font-family="Archivo" font-weight="400" font-size="27">Écrivez-moi, je passe vous montrer en deux minutes.</text><text x="555.5" y="1460" text-anchor="middle" fill="#2458FF" font-family="Archivo" font-weight="700" font-size="30" letter-spacing="1">AYMERIC · 06 63 15 04 49 · TAPOTE.FR</text><text x="555" y="1508" text-anchor="middle" fill="#9A968E" font-family="Archivo" font-weight="400" font-size="22">Fondateur de Tapote, et votre voisin à la Résidence du Golf.</text></svg>